<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battery CSV Plot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22128%22%20height%3D%22128%22%20viewBox%3D%220%200%20128%20128%22%20role%3D%22img%22%20aria-label%3D%22%F0%9F%94%8B%22%20overflow%3D%22hidden%22%3E%3Cstyle%3Esvg%7Bdisplay%3Ablock%7Dtext%7Bdominant-baseline%3Acentral%3B%7D%3C%2Fstyle%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dy%3D%22-0.07em%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%20font-size%3D%22128%22%20font-family%3D%22sans-serif%22%20fill%3D%22%23111111%22%20font-weight%3D%22400%22%3E%F0%9F%94%8B%3C%2Ftext%3E%3C%2Fsvg%3E"
    />
  </head>
  <body>
    <h1>Battery CSV Plot</h1>

    <div id="dropzone" class="dropzone">
      Drop CSV file here
      <br />
      <input id="fileInput" type="file" accept=".csv,text/csv" />
    </div>

    <div id="error" class="error"></div>

    <div class="stats">
      <div class="stat">
        <div class="label">Rows parsed</div>
        <div id="rowsParsed" class="value">0</div>
      </div>
      <div class="stat">
        <div class="label">Discharge cycles</div>
        <div id="cycleCount" class="value">0</div>
      </div>
      <div class="stat">
        <div class="label">Average discharge</div>
        <div id="avgLossDay" class="value">-</div>
      </div>
      <div class="stat">
        <div class="label">Observed range</div>
        <div id="range" class="value">-</div>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>

    <table>
      <thead>
        <tr>
          <th>Cycle</th>
          <th>Start</th>
          <th>End</th>
          <th>From</th>
          <th>To</th>
          <th>Loss</th>
          <th>Duration</th>
          <th>Loss per day</th>
        </tr>
      </thead>
      <tbody id="cycleTable"></tbody>
    </table>

    <script src="script.js"></script>
  </body>
</html>
